{% extends "base.html" %}
{% block content %}
<h1>Packs</h1>
<a href="{{ url_for('new_pack') }}">Add Pack</a>
<table border="1">
  <tr><th>ID</th><th>Name</th><th>Items</th><th>Price</th><th>Actions</th></tr>
  {% for pack in packs %}
  <tr>
    <td>{{ pack.id }}</td><td>{{ pack.name }}</td>
    <td>{{ pack.items }}</td><td>{{ pack.price }}</td>
    <td>
      <a href="{{ url_for('edit_pack', pack_id=pack.id) }}">Edit</a>
      <a href="{{ url_for('delete_pack', pack_id=pack.id) }}">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
