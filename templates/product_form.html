{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit' if product else 'New' }} Product</h1>
<form method="post">
  Name:<br>
  <input type="text" name="name" value="{{ product.name if product else '' }}"><br>
  Price:<br>
  <input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}"><br>
  <button type="submit">Save</button>
</form>
{% endblock %}
