{% extends "base.html" %}
{% block content %}
<h1>Products</h1>
<a href="{{ url_for('new_product') }}">Add Product</a>
<table border="1">
  <tr><th>ID</th><th>Name</th><th>Price</th><th>Actions</th></tr>
  {% for p in products %}
  <tr>
    <td>{{ p.id }}</td><td>{{ p.name }}</td><td>{{ p.price }}</td>
    <td>
      <a href="{{ url_for('edit_product', product_id=p.id) }}">Edit</a>
      <a href="{{ url_for('delete_product', product_id=p.id) }}">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
